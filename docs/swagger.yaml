        type: string
      subtotal:
        format: int64
        type: integer
      taxAmount:
        format: int64
        type: integer
      taxID:
        type: string
      totalAmount:
        format: int64
        type: integer
      updatedAt:
        type: string
    type: object
  orders.OrderItem:
