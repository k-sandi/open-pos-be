basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      employee_id:
        type: string
      pin:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  categories.CreateCategoryRequest:
