      category_id:
        type: string
      description:
        type: string
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
      sku:
        type: string
    type: object
  products.StatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  users.CreateUserRequest:
    properties:
      email:
        type: string
      employee_id:
        type: string
      name:
        type: string
      phone:
        type: string
      pin:
        type: string
      role_id:
        type: string
    type: object
  users.StatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
info:
